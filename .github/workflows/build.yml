name: Windows-VST3 bauen

# Windows-Bau mit Regressionstests und pluginval (Strictness 8).
#   - laeuft bei jedem Push auf main und bei Pull Requests (ausser reinen Doku-Aenderungen)
#   - von Hand: Actions > "Windows-VST3 bauen" > "Run workflow"
#   - ein Release entsteht NUR von Hand mit Haken "publish" und nur auf main (ein Push ist keine Freigabe)
# Beschreibung: docs/CI.md und docs/PUBLISHING.md
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      publish:
        description: "Release mit ZIP veroeffentlichen (nur auf main)"
        type: boolean
        default: false

concurrency:
  group: windows-vst3-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          "GALE_VERSION=$v" >> $env:GITHUB_ENV

      # Schnell scheitern, bevor die Bauminuten verbraucht werden
      - name: Release vorab pruefen
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") { Write-Error "Release nur auf main"; exit 1 }
          if (-not (Test-Path "docs/releases/$env:GALE_VERSION.md")) { Write-Error "docs/releases/$env:GALE_VERSION.md fehlt"; exit 1 }

      - name: Herstelleridentitaet pruefen
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'COMPANY_NAME\s+"Stromschlag Audio"') { throw "Hersteller muss Stromschlag Audio sein" }
          if ($cmake -match '(?i)COMPANY_NAME\s+"[^"]*(Claude|Anthropic)') { throw "Falscher Plugin-Hersteller" }

      - name: Konfigurieren
        run: cmake -B build -A x64

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Regressionstests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Plugin bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Gale-VST3-Windows
          path: build/Gale_artefacts/Release/VST3
          if-no-files-found: error
          retention-days: 14

      - name: Stabilitaetstest (pluginval)
        shell: pwsh
        run: |
          curl.exe -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 8 --validate-in-process --validate "build/Gale_artefacts/Release/VST3/Gale.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: ZIP packen
        shell: pwsh
        run: Compress-Archive -Path "build/Gale_artefacts/Release/VST3/Gale.vst3","THIRD_PARTY_NOTICES.md" -DestinationPath "Gale-VST3-Windows.zip"

      - name: Release mit ZIP erstellen
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.GALE_VERSION }}-b${{ github.run_number }}
          name: Gale v${{ env.GALE_VERSION }}
          make_latest: true
          files: |
            Gale-VST3-Windows.zip
          body_path: docs/releases/${{ env.GALE_VERSION }}.md
